common:
  llms:
    - Qwen2.5-7B
    - Falcon3-7B-Base
    - gemma-2-9b-it
    - Llama-3.1-8B-Instruct
  datasets:
    - belief_bank_constraints
    - belief_bank_facts
    - halu_eval
  layer_source_config: src/o4a/config.py
  layer_types:
    - attn
    - mlp
    - hidden
  max_points_per_class:
    - 1500
  balance:
    - true
  standardize:
    - false
  output_roots:
    - results/pca_multidataset
  seeds:
    - 42
  cache_dirs:
    - activation_cache

htc:
  executable: scripts/PCA/run_plot_pca.sh
  output_dir: scripts/PCA/generated_plot_pca
  logs_dir: logs/plot_pca_htc
  request_cpus: 4
  request_gpus: 0
  request_memory: 16 GB
  max_jobs_per_file: 500
